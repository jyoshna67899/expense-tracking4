<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create Account - Smart Finance Planner</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="auth-page">
  <main class="auth-card">
    <div class="brand">💰 Smart Finance Planner</div>
    <h1>Create your account</h1>
    <p class="muted">Start building your personal financial plan.</p>

    <form id="signupForm">
      <label>Full Name</label>
      <input id="signupName" required placeholder="Your name">

      <label>Email</label>
      <input id="signupEmail" type="email" required placeholder="you@example.com">

      <label>Password</label>
      <input id="signupPassword" type="password" minlength="4" required placeholder="At least 4 characters">

      <button class="btn primary" type="submit">Create Account</button>
    </form>

    <p class="center">Already have an account? <a href="index.html">Login</a></p>
    <p id="signupMessage" class="message"></p>
  </main>
  <script src="js/storage.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
