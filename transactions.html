<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Transactions - Smart Finance Planner</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <div class="brand">💰 Smart Finance</div>
    <nav>
      <a href="dashboard.html">🏠 Dashboard</a>
      <a class="active" href="transactions.html">🧾 Transactions</a>
      <a href="budget.html">💳 Budget</a>
      <a href="savings.html">🎯 Savings Goals</a>
      <a href="analytics.html">📈 Analytics</a>
    </nav>
    <button id="themeToggle" class="nav-button">🌙 Dark Mode</button>
    <button id="logoutBtn" class="nav-button">↪ Logout</button>
  </aside>
  <main class="content">
    <header class="topbar"><div><h1>Transactions</h1><p class="muted">Manage your income and expenses.</p></div></header>
    <section class="panel">
      <form id="transactionForm" class="form-grid">
        <select id="type"><option value="expense">Expense</option><option value="income">Income</option></select>
        <input id="amount" type="number" min="0" required placeholder="Amount">
        <input id="description" required placeholder="Description">
        <select id="category">
          <option>Food</option><option>Shopping</option><option>Transport</option><option>Bills</option>
          <option>Education</option><option>Entertainment</option><option>Healthcare</option><option>Rent</option>
          <option>Travel</option><option>Other</option>
        </select>
        <input id="date" type="date" required>
        <button class="btn primary" type="submit">Add Transaction</button>
      </form>
    </section>
    <section class="panel">
      <div class="toolbar">
        <input id="search" placeholder="Search transactions...">
        <select id="filter"><option value="all">All</option><option value="income">Income</option><option value="expense">Expenses</option></select>
      </div>
      <div id="transactionList"></div>
    </section>
  </main>
</div>
<script src="js/storage.js"></script>
<script src="js/app.js"></script>
</body>
</html>
