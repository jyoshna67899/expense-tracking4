<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard - Smart Finance Planner</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="app">
    <aside class="sidebar">
      <div class="brand">💰 Smart Finance</div>
      <nav>
        <a class="active" href="dashboard.html">🏠 Dashboard</a>
        <a href="transactions.html">🧾 Transactions</a>
        <a href="budget.html">💳 Budget</a>
        <a href="savings.html">🎯 Savings Goals</a>
        <a href="analytics.html">📈 Analytics</a>
      </nav>
      <button id="themeToggle" class="nav-button">🌙 Dark Mode</button>
      <button id="logoutBtn" class="nav-button">↪ Logout</button>
    </aside>

    <main class="content">
      <header class="topbar">
        <div>
          <h1>Welcome, <span id="userName">User</span> 👋</h1>
          <p class="muted">Here is your financial overview.</p>
        </div>
        <a class="btn secondary" href="setup.html">Edit Plan</a>
      </header>

      <section class="cards">
        <div class="stat-card"><span>💵 Total Income</span><strong id="income">₹0</strong></div>
        <div class="stat-card"><span>🎯 Planned Savings</span><strong id="savings">₹0</strong></div>
        <div class="stat-card"><span>🧾 Expenses</span><strong id="expenses">₹0</strong></div>
        <div class="stat-card"><span>💰 Balance</span><strong id="balance">₹0</strong></div>
      </section>

      <section class="grid-2">
        <div class="panel">
          <h2>Monthly Plan</h2>
          <div id="plan"></div>
        </div>
        <div class="panel">
          <h2>Savings Progress</h2>
          <div class="progress"><div id="savingBar"></div></div>
          <p id="savingText" class="muted"></p>
          <div id="tips"></div>
        </div>
      </section>

      <section class="panel">
        <div class="panel-head"><h2>Recent Transactions</h2><a href="transactions.html">View all</a></div>
        <div id="recentTransactions"></div>
      </section>
    </main>
  </div>
  <script src="js/storage.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
